<!DOCTYPE html>
<html>
<head>
    <title>預約紀錄</title>
</head>
<body>
    <h2>所有預約紀錄</h2>
    <table border="1">
        <tr>
            <th>姓名</th>
            <th>車輛</th>
            <th>日期</th>
            <th>時段</th>
        </tr>
        {% for row in bookings %}
        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td>{{ row[3] }}</td>
        </tr>
        {% endfor %}
    </table>
    <br>
    <a href="/">回到預約頁</a>
</body>
</html>
